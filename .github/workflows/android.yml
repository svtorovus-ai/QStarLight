name: Migrate complete QStarLight source

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild QStarLight v0.3.0 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qsl-payload
          base='https://raw.githubusercontent.com/svtorovus-ai/CashPilot/tmp-qsl-v3-build-final/qstarlight-build'
          files=(v3part00.txt v3p01_0.txt v3p01_1.txt v3p01_2.txt v3p01_3.txt v3p01_4.txt v3safe01b.txt v3safe01c.txt v3safe02a.txt v3safe02b.txt v3safe02c.txt v3part03.txt v3part04.txt v3part05a.txt v3part05b.txt v3part06.txt am_00.txt am_01.txt am_02.txt am_03.txt am_04.txt am_05.txt am_06.txt am_07.txt)
          for f in "${files[@]}"; do curl -fsSL "$base/$f" -o "/tmp/qsl-payload/$f"; done
          cat /tmp/qsl-payload/v3part00.txt /tmp/qsl-payload/v3p01_0.txt /tmp/qsl-payload/v3p01_1.txt /tmp/qsl-payload/v3p01_2.txt /tmp/qsl-payload/v3p01_3.txt /tmp/qsl-payload/v3p01_4.txt /tmp/qsl-payload/v3safe01b.txt /tmp/qsl-payload/v3safe01c.txt /tmp/qsl-payload/v3safe02a.txt /tmp/qsl-payload/v3safe02b.txt /tmp/qsl-payload/v3safe02c.txt /tmp/qsl-payload/v3part03.txt /tmp/qsl-payload/v3part04.txt /tmp/qsl-payload/v3part05a.txt /tmp/qsl-payload/v3part05b.txt /tmp/qsl-payload/v3part06.txt > /tmp/QStarLightV3.b64
          test "$(wc -c < /tmp/QStarLightV3.b64)" = '96556'
          base64 -d /tmp/QStarLightV3.b64 > /tmp/QStarLightV3.zip
          rm -rf /tmp/qsl-source && mkdir -p /tmp/qsl-source
          unzip -q /tmp/QStarLightV3.zip -d /tmp/qsl-source || true
          cat /tmp/qsl-payload/am_00.txt /tmp/qsl-payload/am_01.txt /tmp/qsl-payload/am_02.txt /tmp/qsl-payload/am_03.txt /tmp/qsl-payload/am_04.txt /tmp/qsl-payload/am_05.txt /tmp/qsl-payload/am_06.txt /tmp/qsl-payload/am_07.txt > /tmp/activity_main.b64
          base64 -d /tmp/activity_main.b64 > /tmp/qsl-source/app/src/main/res/layout/activity_main.xml
          echo 'fe326cbd9a55c53e7bcf202be54887f7632cc50211d69a49aa9fcd92fc3e9167  /tmp/qsl-source/app/src/main/res/layout/activity_main.xml' | sha256sum -c -
          sed -i 's/Theme.AppCompat.Translucent.NoTitleBar/Theme.AppCompat.DayNight.NoActionBar/' /tmp/qsl-source/app/src/main/res/values/themes.xml
          rm -rf /tmp/qsl-source/signing

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/qsl-source/app/build.gradle.kts')
          p.write_text('''plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          val qstarKeystorePath = System.getenv("QSTAR_KEYSTORE_FILE")
          val qstarStorePassword = System.getenv("QSTAR_STORE_PASSWORD")
          val qstarKeyAlias = System.getenv("QSTAR_KEY_ALIAS")
          val qstarKeyPassword = System.getenv("QSTAR_KEY_PASSWORD")
          val hasStableSigning = listOf(qstarKeystorePath, qstarStorePassword, qstarKeyAlias, qstarKeyPassword).all { !it.isNullOrBlank() }

          android {
              namespace = "ua.grey.qstarlight"
              compileSdk = 35
              defaultConfig {
                  applicationId = "ua.grey.qstarlight"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
                  versionName = "0.3.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }
              if (hasStableSigning) {
                  signingConfigs {
                      create("qstarStable") {
                          storeFile = rootProject.file(qstarKeystorePath!!)
                          storePassword = qstarStorePassword
                          keyAlias = qstarKeyAlias
                          keyPassword = qstarKeyPassword
                      }
                  }
              }
              buildTypes {
                  getByName("debug")
                  release {
                      isMinifyEnabled = false
                      if (hasStableSigning) signingConfig = signingConfigs.getByName("qstarStable")
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              testImplementation("junit:junit:4.13.2")
          }
          ''')
          PY

          rsync -a --delete --exclude='.git/' /tmp/qsl-source/ ./
          rm -f .github/workflows/migrate-from-cashpilot.yml .migration-trigger .migration-trigger-2 .migration-trigger-3

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify complete project
        run: |
          gradle :app:testDebugUnitTest --stacktrace
          gradle :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Commit complete source to QStarLight
        shell: bash
        run: |
          rm -rf .gradle app/build build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --quiet && exit 0
          git commit -m 'Migrate complete QStarLight v0.3.0 project'
          git push origin HEAD:main
