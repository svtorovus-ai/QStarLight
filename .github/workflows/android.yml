name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      QSTAR_KEYSTORE_B64: ${{ secrets.QSTAR_KEYSTORE_B64 }}
      QSTAR_STORE_PASSWORD: ${{ secrets.QSTAR_STORE_PASSWORD }}
      QSTAR_KEY_ALIAS: ${{ secrets.QSTAR_KEY_ALIAS }}
      QSTAR_KEY_PASSWORD: ${{ secrets.QSTAR_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable signing key
        if: ${{ env.QSTAR_KEYSTORE_B64 != '' }}
        run: |
          mkdir -p signing
          printf '%s' "$QSTAR_KEYSTORE_B64" | base64 -d > signing/qstarlight-update.jks

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        if: ${{ env.QSTAR_KEYSTORE_B64 == '' }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Build stable release APK
        if: ${{ env.QSTAR_KEYSTORE_B64 != '' }}
        env:
          QSTAR_KEYSTORE_FILE: signing/qstarlight-update.jks
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify debug APK
        if: ${{ env.QSTAR_KEYSTORE_B64 == '' }}
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Verify release APK
        if: ${{ env.QSTAR_KEYSTORE_B64 != '' }}
        run: unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null

      - name: Upload debug APK
        if: ${{ env.QSTAR_KEYSTORE_B64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QStarLight-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload stable release APK
        if: ${{ env.QSTAR_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QStarLight-release
          path: app/build/outputs/apk/release/app-release.apk
