    private fun startScan(durationMs: Long, onDone: (() -> Unit)? = null) {
        if (scanActive) {
            onDone?.invoke()
            return
        }
        if (!hasScanPermission()) {
            event(EVENT_ERROR, message = "BLE scan: немає дозволу геолокації / Nearby devices")
