        }
        scanActive = false
        event(EVENT_SCAN, message = message)
        val callback = scanDoneCallback
        scanDoneCallback = null
        callback?.invoke()
        if (!interactive && !bootPending && connections.values.none { it.isReady() }) shutdownSoon()
    }

