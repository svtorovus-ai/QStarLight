    private fun ensureConnections(afterReady: (() -> Unit)? = null) {
        if (remoteTakeover) return
        if (afterReady != null) pendingAfterReady = afterReady
        if (!hasConnectPermission() || !adapter.isEnabled) {
            event(EVENT_ERROR, message = "Bluetooth permission or adapter missing")
            scheduleReconnect(2_000)
            return
        }
        val refs = prefs.devices()
        if (refs.isEmpty()) {
            event(EVENT_ERROR, message = "No QStar devices selected")
            return
        }

        val selected = refs.map { it.mac }.toSet()
        connections.keys.filter { it !in selected }.toList().forEach { mac ->
            connections.remove(mac)?.disconnect()
            readyMacs.remove(mac)
        }

        if (allSelectedReady()) {
            onAllReady()
            return
        }

        refs.forEach { ref ->
            if (connections[ref.mac]?.isReady() != true && connectingMac != ref.mac && connectPlan.none { it.mac == ref.mac }) {
                connectPlan.add(ref)
            }
        }
        pumpConnectPlan()
        scheduleReconnect()
    }

    private fun pumpConnectPlan() {
        if (remoteTakeover || connectingMac != null) return
        while (connectPlan.isNotEmpty()) {
            val ref = connectPlan.removeFirst()
            if (connections[ref.mac]?.isReady() == true) continue
            val device = try { adapter.getRemoteDevice(ref.mac) }
            catch (_: Throwable) { continue }
            val connection = LampConnection(this, device, prefs::password, this)
            connections[ref.mac]?.disconnect()
            connections[ref.mac] = connection
            readyMacs.remove(ref.mac)
            connectingMac = ref.mac
            connection.connect()
            handler.postDelayed({
                if (connectingMac == ref.mac && !connection.isReady()) {
                    event(EVENT_ERROR, ref.mac, ref.name, "Connect timeout")
                    connection.disconnect()
                    connectingMac = null
                    scheduleReconnect(350)
                }
            }, 12_000)
            return
        }
        if (allSelectedReady()) onAllReady() else scheduleReconnect()
    }

    private fun scheduleReconnect(delayMs: Long = 1_200L) {
        if (reconnectScheduled || remoteTakeover) return
        val needed = interactive || bootPending || oneShot || latestCct != null || pendingAfterReady != null
        if (!needed) return
        reconnectScheduled = true
        handler.postDelayed({
            reconnectScheduled = false
            if (remoteTakeover || allSelectedReady()) {
                if (allSelectedReady()) onAllReady()
                return@postDelayed
            }
            reconnectRounds++
            if (reconnectRounds % 5 == 0 && tryRecoveryScan()) return@postDelayed
            prefs.devices().forEach { ref ->
                if (connections[ref.mac]?.isReady() != true && connectingMac != ref.mac && connectPlan.none { it.mac == ref.mac }) {
                    connectPlan.add(ref)
                }
            }
            pumpConnectPlan()
            if (!allSelectedReady()) scheduleReconnect()
        }, delayMs)
    }

    private fun tryRecoveryScan(): Boolean {
        val now = SystemClock.elapsedRealtime()
        if (scanActive || !hasScanPermission() || !adapter.isEnabled || !legacyLocationEnabled()) return false
        if (now - lastRecoveryScanAt < 12_000) return false
        lastRecoveryScanAt = now
        startScan(3_000) { ensureConnections() }
        return true
    }

