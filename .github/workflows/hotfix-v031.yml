            event(EVENT_ERROR, message = "BLE scan: Android 10 блокує пошук без увімкненої Геолокації; пробую збережені MAC")
            onDone?.invoke()
            return
        }
        val scanner = try { adapter.bluetoothLeScanner } catch (_: Throwable) { null }
        if (scanner == null) {
            event(EVENT_ERROR, message = "BLE scan: сканер недоступний; пробую збережені MAC")
            onDone?.invoke()
            return
        }
        scanActive = true
        scanDoneCallback = onDone
        discovered.clear()
        try {
            scanner.startScan(scanCallback)
            event(EVENT_SCAN, message = "scan_started")
        } catch (t: Throwable) {
            scanActive = false
            scanDoneCallback = null
            event(EVENT_ERROR, message = "BLE scan failed: ${t.javaClass.simpleName}: ${t.message.orEmpty()}")
            onDone?.invoke()
            return
        }
        handler.postDelayed({ finishScan("scan_finished") }, durationMs)
    }

    private fun finishScan(message: String) {
        if (!scanActive && scanDoneCallback == null) return
        if (scanActive) {
