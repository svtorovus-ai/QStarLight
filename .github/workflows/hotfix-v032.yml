name: QStarLight v0.3.2 BLE and sync hotfix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply patch
        shell: bash
        run: python3 tools/hotfix_v032.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --stacktrace
          gradle :app:assembleDebug --stacktrace
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gradle app/build build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --quiet && exit 0
          git commit -m 'Fix phone-HUB sync, Android 10 scan and BLE failsafe'
          git push origin HEAD:main
